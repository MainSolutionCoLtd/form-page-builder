name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    # Skip docs/changeset-only pushes that can't affect the demo.
    paths-ignore:
      - ".changeset/**"
      - "CHANGELOG.md"
      - "README.md"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Also skip version-bump merges (package.json always changes, so paths-ignore misses them).
    if: "${{ !contains(github.event.head_commit.message, 'chore: version packages') }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:demo
        env:
          GITHUB_PAGES: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
