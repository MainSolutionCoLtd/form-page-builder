name: Release

# Publishing is a deliberate, manual act: cut a GitHub Release (tag vX.Y.Z)
# once the "Version Packages" PR from version.yml has been merged to main.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # for npm provenance
  packages: write # for the GitHub Packages mirror publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >=11.5.1; setup-node's bundled
      # npm is older, so upgrade before publishing.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm publish --provenance --access public

      # GitHub Packages requires a scoped name, unlike the public npm
      # package above, so rename in-place (not committed) for this
      # second, mirror-only publish that makes the release show up in
      # the repo's Packages sidebar.
      - run: npm pkg set name="@MainSolutionCoLtd/form-page-builder"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@MainSolutionCoLtd"
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
